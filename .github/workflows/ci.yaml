name: CI

# Runs on GitHub-hosted runners, which are free here because the repo is public.
# The visual job runs the same pinned Kroki release as production. The browser
# half of the corpus is forced to stay local-only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts so installing does not trigger the example-cache
      # prebuild, which needs an engine this runner cannot reach.
      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  build:
    runs-on: ubuntu-latest
    env:
      # No engine is reachable from here, so do not pretend to render. This is
      # explicit rather than relying on the generator's tolerance for an
      # unreachable engine — an empty corpus should be a decision, not an
      # accident that looks the same as a broken one.
      NEOLESK_CACHE_SKIP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Bundle the Worker entrypoint
        run: npm run bundle:worker

      - name: Start Worker and create a session
        run: npm run test:worker

      - name: Check the bundle is complete
        run: |
          test -s dist/index.html
          test -d dist/assets
          echo "bundle: $(du -sh dist | cut -f1)"

  corpus:
    runs-on: ubuntu-latest
    # Golden images are generated in this exact browser/font environment.
    # Running Playwright directly on ubuntu-latest made text metrics drift even
    # when the SVG bytes and browser version were unchanged.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    env:
      NEOLESK_KROKI_PROXY_TARGET: http://kroki:8000/
    services:
      kroki:
        image: yuzutech/kroki:0.32.1@sha256:6980bfb218b48b74ea14b888d9c7e8c032d1cb6325f3292277abdf62483abd9d
        env:
          KROKI_EXCALIDRAW_HOST: excalidraw
          KROKI_DIAGRAMSNET_HOST: diagramsnet
      excalidraw:
        image: yuzutech/kroki-excalidraw:0.32.1@sha256:214f13c1cd3c3f79a18a83631a900fedbed71b2f39d3a0c5630ac5fa5ad40046
      diagramsnet:
        image: yuzutech/kroki-diagramsnet:0.32.1@sha256:71e7082f736ec003fb33b5cd1c5c40af54c9bfb6351d50fbe73b56fe8f1bd5eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm ci --ignore-scripts

      - name: Wait for Kroki
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://kroki:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Compare all 116 examples with committed images
        run: npm run test:corpus

      - name: Upload visual diffs and trace
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagram-corpus-diffs
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
