name: CI

# Runs on GitHub-hosted runners, which are free here because the repo is public.
# The visual job uses the public neolesk render proxy, which reaches the private
# Kroki service without granting CI direct cluster access.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts so installing does not trigger the example-cache
      # prebuild, which needs an engine this runner cannot reach.
      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  build:
    runs-on: ubuntu-latest
    env:
      # No engine is reachable from here, so do not pretend to render. This is
      # explicit rather than relying on the generator's tolerance for an
      # unreachable engine — an empty corpus should be a decision, not an
      # accident that looks the same as a broken one.
      NEOLESK_CACHE_SKIP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check the bundle is complete
        run: |
          test -s dist/index.html
          test -d dist/assets
          echo "bundle: $(du -sh dist | cut -f1)"

  corpus:
    runs-on: ubuntu-latest
    env:
      NEOLESK_KROKI_PROXY_TARGET: https://diagrams.darrengruber.com/render/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium

      - name: Compare all 116 examples with committed images
        run: npm run test:corpus

      - name: Upload visual diffs and trace
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagram-corpus-diffs
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
