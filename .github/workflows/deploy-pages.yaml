name: Deploy to Cloudflare Pages

# Replaces `npm run deploy` from a laptop with a static CLOUDFLARE_API_TOKEN.
# The token is minted on demand by the OpenBao Cloudflare secrets engine, scoped
# to "Pages Write" only, with a ~5 minute lease. Auth chain:
#
#   GitHub OIDC JWT (id-token: write)
#     -> vault-action exchanges it at jwt-github-actions
#     -> OpenBao role `neolesk-pages-deploy` (bound to this repo + main)
#     -> read cloudflare-account/creds/pages-neolesk
#     -> short-lived CF token
#
# Modelled on fourslide/claudeburner.com .github/workflows/deploy.yml. Role and
# policy live in darren-iac/iac tofu/controlplane/openbao/cloudflare-pages-ci.tf.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS IS workflow_dispatch ONLY, AND CANNOT SUCCEED YET — ONE prerequisite left.
#
#   ✅ The OpenBao side is DONE (darren-iac/iac#2720 + #2724, applied
#      2026-08-11). cloudflare-account/roles/pages-neolesk, the
#      neolesk-pages-deploy policy, and this jwt role all exist. Verified by
#      minting a real token: 300s lease, and it can list Pages projects (sees
#      the neolesk project) while account members, Workers, KV and tokens all
#      return 401/403 and it can see 0 zones. The scope is exactly Pages.
#
#   ❌ There is still no in-cluster runner that can serve THIS repo. OpenBao is
#      tailnet-only, so a GitHub-hosted runner cannot reach it, and GitHub does
#      not support user-account-level ARC scale sets — arc-runners-darrengruber
#      is anchored to darrengruber/skills and only serves its anchor repo. A
#      scale set anchored at this repo is what is missing.
#
# It is deliberately NOT push-triggered: a push-triggered job pointing at a
# runner label that does not exist queues forever and shows as a pending check
# on every commit. Deploys stay manual (`npm run deploy`) until the runner
# lands, then flip the trigger to `push: branches: [main]` and delete this
# notice.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

# id-token: write is what lets the job request a signed OIDC JWT.
permissions:
  id-token: write
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  # In-cluster OpenBao. openbao-ACTIVE, not the round-robin Service: the
  # standbys fail writes with "cannot write to readonly storage", and minting a
  # credential is a write.
  OPENBAO_ADDR: http://openbao-active.openbao.svc.cluster.local:8200
  # Non-secret. The Cloudflare account that owns the neolesk Pages project.
  CLOUDFLARE_ACCOUNT_ID: c6c0da6f79d5b4a62fe1d2eff2f108e5

  # Render the example thumbnails against OUR OWN kroki, never kroki.io. This job
  # runs on an in-cluster runner, so the Service address resolves. Strict, and
  # nothing is allowed to fail: our engine draws all 29 diagram types, so any
  # failure here is a real defect.
  #
  # NOTE the resulting bundle's baked thumbnails therefore come from our engine
  # while the deployed site's RUNTIME engine is public kroki.io (see
  # src/state.ts defaultRenderUrl). That is a deliberate split, but it has one
  # visible edge: a `diagramsnet` example shows a correct cached thumbnail and
  # then fails to re-render live, because kroki.io cannot draw that type. If that
  # matters, the fix is to move the public site onto our engine too — which means
  # exposing it publicly and widening its CORS allowlist, a decision recorded in
  # darren-iac/iac apps/base/kroki/references/gotchas.md.
  NEOLESK_KROKI_ENGINE: http://kroki-main.kroki.svc.cluster.local:8080/
  NEOLESK_CACHE_STRICT: "1"

jobs:
  deploy:
    # See the notice above: this label has no runner set yet.
    runs-on: arc-runners-neolesk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # Renders the example corpus, then builds. Strict, so a rejected example
      # stops the deploy rather than shipping a broken thumbnail to production.
      - run: npm run build

      # Mint a scoped, short-lived Cloudflare token from OpenBao via GitHub OIDC.
      # Exports CLOUDFLARE_API_TOKEN into the job env for the deploy step.
      - name: Mint Cloudflare token (OpenBao)
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          url: ${{ env.OPENBAO_ADDR }}
          method: jwt
          path: jwt-github-actions
          role: neolesk-pages-deploy
          # Must match bound_audiences on the OpenBao role. GitHub's default
          # OIDC audience is the repository OWNER url, which for a personal
          # account is https://github.com/<user>.
          jwtGithubAudience: https://github.com/darrengruber
          secrets: |
            cloudflare-account/creds/pages-neolesk token_value | CLOUDFLARE_API_TOKEN

      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=neolesk --branch=main
